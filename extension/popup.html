<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canvas MCP</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <span class="logo">Canvas MCP</span>
  </div>

  <div class="status-row">
    <span id="dot" class="dot dot--disconnected"></span>
    <span id="status-text">Checking...</span>
  </div>

  <div id="detail" class="detail hidden"></div>

  <div class="actions">
    <button id="reconnect-btn">Reconnect</button>
  </div>

  <div class="footer">
    Make sure <code>python server.py</code> is running<br />
    and Canvas is open in this browser.
  </div>

  <script src="popup.js"></script>
</body>
</html>
